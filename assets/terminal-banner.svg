<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">0xPacman — Ahmed, Cloud Engineer</title>
  <desc id="desc">A dark terminal with yellow Pac-Man artwork. From system calls to cloud scale. Systems, cloud, automation. Based in Morocco.</desc>
